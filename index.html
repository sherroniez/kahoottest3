<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chem Bingo</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ef;--ink:#3b2f4a;--pink:#ff8fab;--blue:#8ecae6;--yel:#ffe66d;--grn:#95d5b2;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:Mali,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#app{max-width:960px;margin:0 auto;padding:14px}
h1,h2{margin:.3em 0}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);border-radius:12px;background:var(--yel);padding:8px 14px;color:var(--ink)}
button.big{font-size:1.3rem;background:var(--pink);padding:12px 22px}
button:disabled{opacity:.35;cursor:default}
input{font:inherit;padding:10px;border:2px solid var(--ink);border-radius:12px;width:100%;max-width:320px}
.box{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px;margin:10px 0}
.chip{display:inline-block;background:var(--blue);border-radius:20px;padding:3px 12px;margin:3px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:460px;margin:auto}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:12px;background:#fff;font-size:clamp(1rem,5vw,1.6rem);font-weight:700;text-align:center;padding:0}
.cell.sel{background:var(--yel);outline:3px solid var(--pink)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.pal button{background:#fff;padding:8px 2px;font-size:1.05rem;font-weight:700}
.pal button:disabled{background:#ddd}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.hgrid button{background:#fff;text-align:center;padding:6px 4px}
.hgrid button b{display:block;font-size:1.2rem}
.hgrid button small{display:block;font-size:.75rem}
.hgrid button.on{background:var(--grn);text-decoration:line-through;opacity:.7}
.timer{font-size:2.4rem;font-weight:700;text-align:center;color:#d90368}
#bingo{position:fixed;inset:0;z-index:9;background:rgba(255,230,109,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:pop .6s ease-out}
#bingo .w{font-size:clamp(4rem,22vw,12rem);font-weight:700;color:#d90368;text-shadow:4px 4px 0 #fff;animation:bounce 1s infinite}
@keyframes bounce{50%{transform:scale(1.12) rotate(-3deg)}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.c{text-align:center}
</style></head>
<body><div id="app">กำลังโหลด...</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ====== ตั้งค่า (แก้ 2 อย่างนี้) ====== */
const firebaseConfig = {
  apiKey: "AIzaSyD0-_W9uh7bl_-OmpNoOxMUhoanWN4zt4g",
  authDomain: "test3-27a5f.firebaseapp.com",
  databaseURL: "https://test3-27a5f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "test3-27a5f",
  storageBucket: "test3-27a5f.firebasestorage.app",
  messagingSenderId: "778662881767",
  appId: "1:778662881767:web:8b7d4fab43b7ac3af2f542"
};
const HOST_PIN = "366282";      // รหัสเข้าหน้าครู (เปิดด้วย index.html?host=1)
const MAX_PLAYERS = 100, FILL_MS = 5*60*1000;

/* ====== สารประกอบ 50 ตัว (ข้อ 27 ในรูปซ้ำกับข้อ 4 จึงเปลี่ยนเป็น LiOH) ====== */
const C=[["NaCl","โซเดียมคลอไรด์"],["KBr","โพแทสเซียมโบรไมด์"],["NaI","โซเดียมไอโอไดด์"],["NaF","โซเดียมฟลูออไรด์"],["Ni(OH)2","นิกเกิล(II)ไฮดรอกไซด์"],
["KCl","โพแทสเซียมคลอไรด์"],["LiBr","ลิเทียมโบรไมด์"],["KI","โพแทสเซียมไอโอไดด์"],["NaNO3","โซเดียมไนเตรต"],["NaOH","โซเดียมไฮดรอกไซด์"],
["MgCl2","แมกนีเซียมคลอไรด์"],["MgBr2","แมกนีเซียมโบรไมด์"],["MgI2","แมกนีเซียมไอโอไดด์"],["KNO3","โพแทสเซียมไนเตรต"],["KOH","โพแทสเซียมไฮดรอกไซด์"],
["CaCl2","แคลเซียมคลอไรด์"],["CaBr2","แคลเซียมโบรไมด์"],["CaI2","แคลเซียมไอโอไดด์"],["Ca(NO3)2","แคลเซียมไนเตรต"],["Ca(OH)2","แคลเซียมไฮดรอกไซด์"],
["Na2O","โซเดียมออกไซด์"],["Li2O","ลิเทียมออกไซด์"],["Na2S","โซเดียมซัลไฟด์"],["Mg(NO3)2","แมกนีเซียมไนเตรต"],["Mg(OH)2","แมกนีเซียมไฮดรอกไซด์"],
["K2O","โพแทสเซียมออกไซด์"],["LiOH","ลิเทียมไฮดรอกไซด์"],["K2S","โพแทสเซียมซัลไฟด์"],["NaClO","โซเดียมไฮโปคลอไรต์"],["Zn(OH)2","ซิงค์ไฮดรอกไซด์"],
["MgO","แมกนีเซียมออกไซด์"],["SrCl2","สตรอนเชียมคลอไรด์"],["ZnCl2","ซิงค์คลอไรด์"],["CuSO4","คอปเปอร์(II)ซัลเฟต"],["Fe(OH)3","ไอรอน(III)ไฮดรอกไซด์"],
["CaO","แคลเซียมออกไซด์"],["BaCl2","แบเรียมคลอไรด์"],["FeCl2","ไอรอน(II)คลอไรด์"],["ZnSO4","ซิงค์ซัลเฟต"],["Al(OH)3","อะลูมิเนียมไฮดรอกไซด์"],
["LiCl","ลิเทียมคลอไรด์"],["AgBr","ซิลเวอร์โบรไมด์"],["AgI","ซิลเวอร์ไอโอไดด์"],["FeSO4","ไอรอน(II)ซัลเฟต"],["CaCO3","แคลเซียมคาร์บอเนต"],
["AgCl","ซิลเวอร์คลอไรด์"],["CuCl","คอปเปอร์(I)คลอไรด์"],["NiCl2","นิกเกิล(II)คลอไรด์"],["CoCl2","โคบอลต์(II)คลอไรด์"],["PbCl2","เลด(II)คลอไรด์"]];

function fail(m){document.getElementById('app').innerHTML='<div style="max-width:560px;margin:20px auto;padding:16px;border:2px solid #3b2f4a;border-radius:16px;background:#fff;font-family:sans-serif"><h2>⚠️ เชื่อมต่อฐานข้อมูลไม่ได้</h2>'+m+'</div>'}
const TIPS='<p>ตรวจสอบตามนี้:</p><ol><li>ค่า <b>firebaseConfig</b> ในไฟล์ถูกต้อง และมี <b>databaseURL</b> (ขึ้นต้น https:// ลงท้าย firebasedatabase.app หรือ firebaseio.com)</li><li>สร้าง <b>Realtime Database</b> แล้ว (ไม่ใช่ Firestore)</li><li>แท็บ <b>Rules</b> ตั้งเป็น <code>{"rules":{"bingo":{".read":true,".write":true}}}</code> แล้วกด Publish</li><li>เครือข่ายไม่บล็อก gstatic.com / firebaseio.com</li></ol>';
let db,R;
try{
  if(/ใส่ของคุณ/.test(JSON.stringify(firebaseConfig)))throw new Error('ยังไม่ได้ใส่ค่า firebaseConfig ในไฟล์');
  firebase.initializeApp(firebaseConfig);db=firebase.database();R=db.ref('bingo');
}catch(e){fail('<p>'+e.message+'</p>'+TIPS);throw e}
const bad=e=>fail('<p>'+String(e&&e.message||e)+'</p>'+TIPS);
setTimeout(()=>{if(!(ready&3))bad('ไม่ได้รับข้อมูลจากฐานข้อมูลภายใน 8 วินาที')},8000);
const HOST=/[?&]host/.test(location.search);
const $=id=>document.getElementById(id), app=$('app');
const f=s=>s.replace(/(\d+)/g,'<sub>$1</sub>');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=ms=>{const s=Math.ceil(Math.max(0,ms)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let offset=0; db.ref('.info/serverTimeOffset').on('value',s=>{offset=s.val()||0});
const now=()=>Date.now()+offset;

let game={state:'lobby'},names={},cards={},called={},bingo={},ready=0;
let pid=localStorage.getItem('bpid'),card=Array(16).fill(-1),sel=0,authed=sessionStorage.getItem('hok')==='1';
const empty=()=>Array(16).fill(-1),pend={};

/* เส้นบิงโก: 4 แถว 4 หลัก 2 ทแยง */
const L=[[0,5,10,15],[3,6,9,12]];
for(let i=0;i<4;i++){L.push([0,1,2,3].map(j=>i*4+j),[0,1,2,3].map(j=>j*4+i))}
const wins=c=>c&&L.some(l=>l.every(i=>c[i]>=0&&called[c[i]]));

let tmr;const sched=()=>{clearTimeout(tmr);tmr=setTimeout(render,150)};
R.child('game').on('value',s=>{const o=game.state;game=s.val()||{state:'lobby'};
  if(o!=='lobby'&&game.state==='lobby'){card=empty();sel=0}
  if(game.state==='lobby')for(const k in pend)delete pend[k];
  ready|=1;render();check();},bad);
R.child('names').on('value',s=>{names=s.val()||{};ready|=2;sched()},bad);
R.child('bingo').on('value',s=>{bingo=s.val()||{};sched()},bad);
if(HOST){
  R.child('cards').on('value',s=>{cards=s.val()||{};check();sched()});
  R.child('called').on('value',s=>{called=s.val()||{};check();sched()});
}else if(pid){
  R.child('cards/'+pid).once('value').then(s=>{if(s.val())card=s.val().map(x=>x==null?-1:x);sched()});
}
setInterval(()=>{const e=$('t');if(e&&game.fillEnd)e.textContent=fmt(game.fillEnd-now())},400);

/* ครู: ตรวจบิงโกและบันทึกผล */
function check(){
  if(!HOST||!authed||game.state!=='play')return;
  for(const p in names){
    const w=wins((cards[p]||[]).map(x=>x==null?-1:x));
    if(w&&!bingo[p]&&!pend[p]){pend[p]=1;R.child('bingo/'+p).set(now())}
    if(!w&&(bingo[p]||pend[p])){delete pend[p];R.child('bingo/'+p).remove()}
  }
}

function render(){
  if(!(ready&3)){return}
  const y=window.scrollY||0;
  HOST?renderHost():renderStudent();
  window.scrollTo(0,y);
}

/* ================= นักเรียน ================= */
function renderStudent(){
  if(!pid||!names[pid]){
    if($('nm'))return;
    app.innerHTML=`<div class="box c"><h1>⚗️ Chem Bingo</h1><p>ใส่ชื่อเล่นเพื่อเข้าห้อง</p>
      <input id="nm" maxlength="20" placeholder="ชื่อเล่น"><p><button class="big" onclick="join()">เข้าห้อง</button></p></div>`;return;
  }
  const st=game.state,n=Object.keys(names).length;
  let h=`<h2 class="c">สวัสดี ${esc(names[pid])} 👋</h2>`;
  if(st==='lobby'){
    h+=`<div class="box c"><h2>⏳ รอครูเริ่มเกม...</h2><p>ผู้เล่นในห้อง ${n} คน</p>${Object.values(names).slice(-60).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}${n>60?` <span class="chip">…และอีก ${n-60} คน</span>`:''}</div>`;
  }else{
    const open=st==='fill'&&now()<game.fillEnd;
    if(st==='fill')h+=`<div class="timer">⏱ <span id="t">${fmt(game.fillEnd-now())}</span></div><p class="c">เลือกสารประกอบมาใส่ตาราง 16 ช่อง (ไม่ซ้ำกัน)</p>`;
    else h+=`<p class="c"><b>ตั้งใจฟังชื่อสาร แล้วดูว่าสูตรไหนในตารางคือสารนั้น!</b></p>`;
    h+=`<div class="grid4">${card.map((id,i)=>`<button class="cell ${open&&i===sel?'sel':''}" onclick="pick(${i})">${id>=0?f(C[id][0]):''}</button>`).join('')}</div>`;
    if(open){
      h+=`<p class="c"><button onclick="clr()">ล้างช่องที่เลือก</button> เหลืออีก ${card.filter(x=>x<0).length} ช่อง</p>
      <div class="box"><div class="pal">${C.map((c,i)=>`<button ${card.includes(i)?'disabled':''} onclick="put(${i})">${f(c[0])}</button>`).join('')}</div></div>`;
    }
  }
  if(bingo[pid]){
    const rank=Object.values(bingo).filter(t=>t<=bingo[pid]).length;
    h+=`<div id="bingo"><div class="w">BINGO!</div><h2>🎉 คุณคือคนที่ ${rank} 🎉</h2></div>`;
  }
  app.innerHTML=h;
}
async function join(){
  const n=$('nm').value.trim();if(!n)return;
  const s=await R.child('names').once('value');
  if(s.numChildren()>=MAX_PLAYERS){alert('ห้องเต็มแล้ว ('+MAX_PLAYERS+' คน)');return}
  const r=R.child('names').push();await r.set(n);
  pid=r.key;localStorage.setItem('bpid',pid);card=empty();sel=0;
}
const canEdit=()=>game.state==='fill'&&now()<game.fillEnd;
const save=()=>R.child('cards/'+pid).set(card);
function pick(i){if(!canEdit())return;sel=i;render()}
function put(id){if(!canEdit()||card.includes(id))return;card[sel]=id;const nx=card.findIndex(x=>x<0);if(nx>=0)sel=nx;save();render()}
function clr(){if(!canEdit())return;card[sel]=-1;save();render()}

/* ================= ครู ================= */
function renderHost(){
  if(!authed){
    if($('pin'))return;
    app.innerHTML=`<div class="box c"><h2>🔒 หน้าครู</h2><input id="pin" type="password" placeholder="รหัส"><p><button class="big" onclick="login()">เข้าสู่ระบบ</button></p></div>`;return;
  }
  const st=game.state,n=Object.keys(names).length;
  let h=`<h1>👩‍🏫 หน้าครู <small>(${n}/${MAX_PLAYERS} คน)</small></h1>`;
  if(st==='lobby'){
    h+=`<div class="box">${n?Object.values(names).map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'ยังไม่มีผู้เล่น'}</div>
    <button class="big" ${n?'':'disabled'} onclick="startFill()">▶ เริ่มเกม (ให้เติมตาราง 5 นาที)</button>
    <p><button onclick="wipe()">ล้างรายชื่อผู้เล่นทั้งหมด</button></p>`;
  }else if(st==='fill'){
    const done=Object.values(cards).filter(c=>c&&c.filter(x=>x>=0).length===16).length;
    h+=`<div class="box c"><div class="timer" id="t">${fmt(game.fillEnd-now())}</div><p>เติมครบแล้ว ${done}/${n} คน</p>
    <button class="big" onclick="startPlay()">▶ เข้าสู่เกม (เริ่มเรียกชื่อสาร)</button></div>`;
  }else{
    const ws=Object.entries(bingo).sort((a,b)=>a[1]-b[1]);
    h+=`<div class="box"><b>🏆 ผู้ที่บิงโก:</b> ${ws.length?ws.map(([p],i)=>`<span class="chip" style="background:${i<3?'var(--yel)':'var(--blue)'}">${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${esc(names[p]||'?')}</span>`).join(''):'ยังไม่มี'}</div>
    <p>กดสารที่อ่านแล้ว (นักเรียนไม่เห็น) — อ่านแล้ว ${Object.keys(called).length}/50 ตัว</p>
    <div class="hgrid">${C.map((c,i)=>`<button class="${called[i]?'on':''}" onclick="tog(${i})"><b>${f(c[0])}</b><small>${c[1]}</small></button>`).join('')}</div>
    <p><button onclick="newRound()">🔄 รอบใหม่ (เก็บรายชื่อไว้)</button> <button onclick="wipe()">ล้างทุกอย่าง</button></p>`;
  }
  app.innerHTML=h;
}
function login(){if($('pin').value===HOST_PIN){authed=true;sessionStorage.setItem('hok','1');render()}else alert('รหัสไม่ถูกต้อง')}
const startFill=()=>R.child('game').set({state:'fill',fillEnd:now()+FILL_MS});
const startPlay=()=>R.child('game').update({state:'play'});
const tog=i=>R.child('called/'+i).set(called[i]?null:true);
function newRound(){if(!confirm('เริ่มรอบใหม่?'))return;R.child('cards').remove();R.child('called').remove();R.child('bingo').remove();R.child('game').set({state:'lobby'})}
function wipe(){if(!confirm('ล้างทุกอย่างรวมรายชื่อ?'))return;R.remove().then(()=>R.child('game').set({state:'lobby'}))}
</script></body></html>
